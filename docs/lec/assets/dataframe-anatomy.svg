<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">DataFrame과 Series 구조</title>
  <desc id="desc">행과 열로 이루어진 DataFrame에서 age 열 하나를 꺼내 Series가 되는 과정을 보여준다.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 22px; font-weight: 700; }
      .body { font-size: 20px; }
      .small { font-size: 17px; }
      .cell { fill: #ffffff; stroke: #9eb7ca; stroke-width: 2; }
      .header { fill: #d9f3ee; stroke: #3a9f94; stroke-width: 2; }
      .index { fill: #eef4f8; stroke: #9eb7ca; stroke-width: 2; }
      .focus { fill: #fff1bb; stroke: #e6a819; stroke-width: 3; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 Z" fill="#3b82c4"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="24" fill="#f8fbfd"/>
  <text x="60" y="60" class="title">DataFrame = 행과 열이 있는 표 (2차원)</text>
  <text x="60" y="100" class="body">엑셀 표를 떠올리면 가장 쉽습니다.</text>

  <text x="210" y="145" class="subtitle">열(column) — 같은 종류의 값</text>
  <line x1="385" y1="160" x2="385" y2="190" stroke="#3b82c4" stroke-width="4" marker-end="url(#arrow)"/>

  <g transform="translate(90,200)">
    <rect x="0" y="0" width="100" height="70" class="header"/>
    <rect x="100" y="0" width="180" height="70" class="header"/>
    <rect x="280" y="0" width="140" height="70" class="focus"/>
    <rect x="420" y="0" width="180" height="70" class="header"/>
    <text x="50" y="43" text-anchor="middle" class="body">index</text>
    <text x="190" y="43" text-anchor="middle" class="body">name</text>
    <text x="350" y="43" text-anchor="middle" class="body">age</text>
    <text x="510" y="43" text-anchor="middle" class="body">city</text>

    <rect x="0" y="70" width="100" height="70" class="index"/>
    <rect x="100" y="70" width="180" height="70" class="cell"/>
    <rect x="280" y="70" width="140" height="70" class="focus"/>
    <rect x="420" y="70" width="180" height="70" class="cell"/>
    <text x="50" y="113" text-anchor="middle" class="body">0</text>
    <text x="190" y="113" text-anchor="middle" class="body">Kim</text>
    <text x="350" y="113" text-anchor="middle" class="body">20</text>
    <text x="510" y="113" text-anchor="middle" class="body">Seoul</text>

    <rect x="0" y="140" width="100" height="70" class="index"/>
    <rect x="100" y="140" width="180" height="70" class="cell"/>
    <rect x="280" y="140" width="140" height="70" class="focus"/>
    <rect x="420" y="140" width="180" height="70" class="cell"/>
    <text x="50" y="183" text-anchor="middle" class="body">1</text>
    <text x="190" y="183" text-anchor="middle" class="body">Lee</text>
    <text x="350" y="183" text-anchor="middle" class="body">25</text>
    <text x="510" y="183" text-anchor="middle" class="body">Busan</text>

    <rect x="0" y="210" width="100" height="70" class="index"/>
    <rect x="100" y="210" width="180" height="70" class="cell"/>
    <rect x="280" y="210" width="140" height="70" class="focus"/>
    <rect x="420" y="210" width="180" height="70" class="cell"/>
    <text x="50" y="253" text-anchor="middle" class="body">2</text>
    <text x="190" y="253" text-anchor="middle" class="body">Park</text>
    <text x="350" y="253" text-anchor="middle" class="body">30</text>
    <text x="510" y="253" text-anchor="middle" class="body">Incheon</text>
  </g>

  <text x="90" y="175" class="small">아래 한 줄이 행(row)</text>

  <line x1="700" y1="340" x2="790" y2="340" stroke="#3b82c4" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="745" y="315" text-anchor="middle" class="small">df["age"]</text>

  <g transform="translate(820,180)">
    <rect x="0" y="0" width="320" height="350" rx="20" fill="#ffffff" stroke="#e6a819" stroke-width="3"/>
    <text x="160" y="55" text-anchor="middle" class="subtitle">Series = 열 하나 (1차원)</text>
    <rect x="45" y="85" width="90" height="55" class="index"/><rect x="135" y="85" width="140" height="55" class="focus"/>
    <rect x="45" y="140" width="90" height="55" class="index"/><rect x="135" y="140" width="140" height="55" class="focus"/>
    <rect x="45" y="195" width="90" height="55" class="index"/><rect x="135" y="195" width="140" height="55" class="focus"/>
    <text x="90" y="121" text-anchor="middle" class="body">0</text><text x="205" y="121" text-anchor="middle" class="body">20</text>
    <text x="90" y="176" text-anchor="middle" class="body">1</text><text x="205" y="176" text-anchor="middle" class="body">25</text>
    <text x="90" y="231" text-anchor="middle" class="body">2</text><text x="205" y="231" text-anchor="middle" class="body">30</text>
    <text x="160" y="295" text-anchor="middle" class="body">Name: age</text>
    <text x="160" y="326" text-anchor="middle" class="small">왼쪽은 index, 오른쪽은 값</text>
  </g>

  <text x="90" y="565" class="subtitle">기억하기: 행은 가로, 열은 세로, index는 행의 이름입니다.</text>
</svg>

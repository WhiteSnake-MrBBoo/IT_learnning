<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">자전거 대여량 회귀 학습 흐름</title>
  <desc id="desc">CSV 불러오기에서 시간 특성 생성, 탐색적 데이터 분석, 회귀 모델 학습, 예측 평가로 이어지는 다섯 단계</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
    <style>
      .box { stroke-width: 2; rx: 18; }
      .step { font: 700 16px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #334155; }
      .label { font: 700 22px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #0f172a; }
      .sub { font: 15px 'Malgun Gothic', 'Noto Sans KR', sans-serif; fill: #475569; }
      .arrow { stroke: #64748b; stroke-width: 3; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1200" height="300" rx="24" fill="#f8fafc"/>
  <text x="60" y="45" class="step">lec11 전체 흐름</text>

  <rect x="45" y="80" width="190" height="145" class="box" fill="#dbeafe" stroke="#3b82f6"/>
  <text x="140" y="115" text-anchor="middle" class="step">1단계</text>
  <text x="140" y="153" text-anchor="middle" class="label">CSV 읽기</text>
  <text x="140" y="183" text-anchor="middle" class="sub">train · test · 제출 양식</text>

  <line x1="245" y1="152" x2="274" y2="152" class="arrow"/>

  <rect x="285" y="80" width="190" height="145" class="box" fill="#dcfce7" stroke="#22c55e"/>
  <text x="380" y="115" text-anchor="middle" class="step">2단계</text>
  <text x="380" y="153" text-anchor="middle" class="label">시간 특성</text>
  <text x="380" y="183" text-anchor="middle" class="sub">연 · 월 · 시간 · 요일</text>

  <line x1="485" y1="152" x2="514" y2="152" class="arrow"/>

  <rect x="525" y="80" width="190" height="145" class="box" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="620" y="115" text-anchor="middle" class="step">3단계 · 현재 완료</text>
  <text x="620" y="153" text-anchor="middle" class="label">EDA</text>
  <text x="620" y="183" text-anchor="middle" class="sub">분포 · 상관 · 그룹 비교</text>

  <line x1="725" y1="152" x2="754" y2="152" class="arrow"/>

  <rect x="765" y="80" width="190" height="145" class="box" fill="#f3e8ff" stroke="#a855f7" stroke-dasharray="8 6"/>
  <text x="860" y="115" text-anchor="middle" class="step">4단계 · 다음 작업</text>
  <text x="860" y="153" text-anchor="middle" class="label">회귀 학습</text>
  <text x="860" y="183" text-anchor="middle" class="sub">X와 y · 누수 방지</text>

  <line x1="965" y1="152" x2="994" y2="152" class="arrow"/>

  <rect x="1005" y="80" width="150" height="145" class="box" fill="#ffe4e6" stroke="#f43f5e" stroke-dasharray="8 6"/>
  <text x="1080" y="115" text-anchor="middle" class="step">5단계</text>
  <text x="1080" y="153" text-anchor="middle" class="label">평가</text>
  <text x="1080" y="183" text-anchor="middle" class="sub">RMSLE</text>

  <text x="600" y="265" text-anchor="middle" class="sub">실선 상자: 현재 Notebook에 구현됨 · 점선 상자: 문서에서 보충한 다음 단계</text>
</svg>

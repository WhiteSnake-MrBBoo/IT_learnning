<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">loc와 iloc 선택 기준</title>
  <desc id="desc">iloc은 숫자 위치, loc는 이름과 조건으로 선택하며 슬라이스 끝 포함 규칙이 다름을 보여준다.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .h { font-size: 28px; font-weight: 700; }
      .body { font-size: 21px; }
      .code { font-family: Consolas, monospace; font-size: 22px; fill: #102a43; }
      .tag { font-size: 18px; font-weight: 700; }
    </style>
  </defs>
  <rect width="1200" height="520" rx="24" fill="#f8fbfd"/>
  <text x="60" y="60" class="title">데이터 선택: 위치를 말하면 iloc, 이름을 말하면 loc</text>

  <g transform="translate(60,105)">
    <rect width="515" height="335" rx="22" fill="#e9f3ff" stroke="#4b91d1" stroke-width="3"/>
    <circle cx="65" cy="64" r="34" fill="#4b91d1"/><text x="65" y="73" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">1</text>
    <text x="120" y="72" class="h">iloc = 정수 위치</text>
    <text x="40" y="125" class="body">“앞에서 몇 번째인가?”로 고릅니다.</text>
    <rect x="35" y="155" width="445" height="58" rx="12" fill="#ffffff"/>
    <text x="55" y="192" class="code">df.iloc[0:2, 0:3]</text>
    <text x="40" y="255" class="body">0~1번 행, 0~2번 열</text>
    <rect x="40" y="278" width="360" height="38" rx="19" fill="#ffffff"/>
    <text x="220" y="304" text-anchor="middle" class="tag">끝 숫자 2와 3은 포함하지 않음</text>
  </g>

  <g transform="translate(625,105)">
    <rect width="515" height="335" rx="22" fill="#eaf8f3" stroke="#34998a" stroke-width="3"/>
    <circle cx="65" cy="64" r="34" fill="#34998a"/><text x="65" y="73" text-anchor="middle" font-size="27" font-weight="700" fill="#ffffff">2</text>
    <text x="120" y="72" class="h">loc = 라벨·조건</text>
    <text x="40" y="125" class="body">“이 이름 또는 조건인가?”로 고릅니다.</text>
    <rect x="35" y="155" width="445" height="58" rx="12" fill="#ffffff"/>
    <text x="55" y="192" class="code">df.loc[0:2, "CRIM":"NOX"]</text>
    <text x="40" y="255" class="body">라벨 0~2행, CRIM~NOX열</text>
    <rect x="40" y="278" width="360" height="38" rx="19" fill="#ffffff"/>
    <text x="220" y="304" text-anchor="middle" class="tag">끝 라벨 2와 NOX도 포함</text>
  </g>

  <text x="600" y="485" text-anchor="middle" class="body">값 하나만 고르면: 이름은 at · 위치는 iat</text>
</svg>

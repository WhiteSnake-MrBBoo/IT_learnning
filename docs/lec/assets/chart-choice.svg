<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720" role="img" aria-labelledby="title desc">
  <title id="title">질문에 따른 그래프 선택</title>
  <desc id="desc">변화, 비교, 관계, 분포, 위치 질문에 적합한 그래프를 연결한다.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .h { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
    </style>
  </defs>
  <rect width="1300" height="720" rx="24" fill="#f8fbfd"/>
  <text x="55" y="58" class="title">먼저 질문을 정하면 그래프가 쉬워집니다</text>

  <g transform="translate(55,100)">
    <rect width="225" height="250" rx="20" fill="#e9f3ff" stroke="#4b91d1" stroke-width="3"/>
    <text x="112" y="45" text-anchor="middle" class="h">시간에 따른 변화?</text>
    <polyline points="30,165 70,145 105,158 145,95 195,70" fill="none" stroke="#337fbd" stroke-width="7" stroke-linejoin="round"/>
    <circle cx="30" cy="165" r="6" fill="#337fbd"/><circle cx="70" cy="145" r="6" fill="#337fbd"/><circle cx="105" cy="158" r="6" fill="#337fbd"/><circle cx="145" cy="95" r="6" fill="#337fbd"/><circle cx="195" cy="70" r="6" fill="#337fbd"/>
    <text x="112" y="225" text-anchor="middle" class="h">선 그래프</text>
  </g>

  <g transform="translate(300,100)">
    <rect width="225" height="250" rx="20" fill="#eaf8f3" stroke="#34998a" stroke-width="3"/>
    <text x="112" y="45" text-anchor="middle" class="h">종류별 크기 비교?</text>
    <rect x="35" y="130" width="30" height="60" fill="#58b6a7"/><rect x="80" y="95" width="30" height="95" fill="#58b6a7"/><rect x="125" y="70" width="30" height="120" fill="#58b6a7"/><rect x="170" y="110" width="30" height="80" fill="#58b6a7"/>
    <line x1="25" y1="190" x2="205" y2="190" stroke="#17324d" stroke-width="3"/>
    <text x="112" y="225" text-anchor="middle" class="h">막대 그래프</text>
  </g>

  <g transform="translate(545,100)">
    <rect width="225" height="250" rx="20" fill="#fff7df" stroke="#e5aa27" stroke-width="3"/>
    <text x="112" y="45" text-anchor="middle" class="h">두 숫자의 관계?</text>
    <g fill="#d99b13"><circle cx="45" cy="165" r="7"/><circle cx="72" cy="145" r="7"/><circle cx="95" cy="152" r="7"/><circle cx="118" cy="112" r="7"/><circle cx="146" cy="98" r="7"/><circle cx="180" cy="73" r="7"/></g>
    <line x1="30" y1="190" x2="200" y2="60" stroke="#e7bd59" stroke-width="3" stroke-dasharray="8 7"/>
    <text x="112" y="225" text-anchor="middle" class="h">산점도</text>
  </g>

  <g transform="translate(790,100)">
    <rect width="225" height="250" rx="20" fill="#f0ebff" stroke="#8066c9" stroke-width="3"/>
    <text x="112" y="45" text-anchor="middle" class="h">값이 어떻게 퍼짐?</text>
    <rect x="30" y="155" width="24" height="35" fill="#9580cf"/><rect x="55" y="120" width="24" height="70" fill="#9580cf"/><rect x="80" y="80" width="24" height="110" fill="#9580cf"/><rect x="105" y="65" width="24" height="125" fill="#9580cf"/><rect x="130" y="100" width="24" height="90" fill="#9580cf"/><rect x="155" y="140" width="24" height="50" fill="#9580cf"/>
    <text x="112" y="225" text-anchor="middle" class="h">히스토그램</text>
  </g>

  <g transform="translate(1035,100)">
    <rect width="225" height="250" rx="20" fill="#ffeceb" stroke="#d9685f" stroke-width="3"/>
    <text x="112" y="45" text-anchor="middle" class="h">장소가 어디인가?</text>
    <path d="M35 85 Q70 55 110 82 T195 82 V185 H35 Z" fill="#cce7d6" stroke="#7bb790" stroke-width="3"/>
    <path d="M112 75c-23 0-38 17-38 37 0 30 38 67 38 67s38-37 38-67c0-20-15-37-38-37z" fill="#d9685f"/>
    <circle cx="112" cy="112" r="12" fill="#ffffff"/>
    <text x="112" y="225" text-anchor="middle" class="h">지도·마커</text>
  </g>

  <g transform="translate(120,410)">
    <rect width="500" height="230" rx="22" fill="#ffffff" stroke="#6da9d6" stroke-width="3"/>
    <text x="250" y="48" text-anchor="middle" class="h">범주마다 분포를 비교한다면?</text>
    <line x1="70" y1="120" x2="430" y2="120" stroke="#b8c8d5" stroke-width="3"/>
    <rect x="135" y="80" width="70" height="80" fill="#dceeff" stroke="#4b91d1" stroke-width="3"/><line x1="135" y1="120" x2="205" y2="120" stroke="#4b91d1" stroke-width="4"/>
    <rect x="300" y="95" width="70" height="55" fill="#d9f3ee" stroke="#34998a" stroke-width="3"/><line x1="300" y1="125" x2="370" y2="125" stroke="#34998a" stroke-width="4"/>
    <text x="250" y="205" text-anchor="middle" class="h">박스플롯·바이올린플롯</text>
  </g>

  <g transform="translate(680,410)">
    <rect width="500" height="230" rx="22" fill="#ffffff" stroke="#6da9d6" stroke-width="3"/>
    <text x="250" y="48" text-anchor="middle" class="h">두 범주의 조합이나 상관 구조?</text>
    <g transform="translate(150,72)">
      <rect x="0" y="0" width="55" height="40" fill="#e9f3ff"/><rect x="55" y="0" width="55" height="40" fill="#89bff0"/><rect x="110" y="0" width="55" height="40" fill="#337fbd"/>
      <rect x="0" y="40" width="55" height="40" fill="#d9f3ee"/><rect x="55" y="40" width="55" height="40" fill="#78cbbd"/><rect x="110" y="40" width="55" height="40" fill="#34998a"/>
      <rect x="0" y="80" width="55" height="40" fill="#fff2bf"/><rect x="55" y="80" width="55" height="40" fill="#ffd66b"/><rect x="110" y="80" width="55" height="40" fill="#e5aa27"/>
    </g>
    <text x="250" y="205" text-anchor="middle" class="h">히트맵</text>
  </g>

  <text x="650" y="690" text-anchor="middle" class="body">그래프 도구를 먼저 고르지 말고, 내가 답하려는 질문을 먼저 한 문장으로 적습니다.</text>
</svg>

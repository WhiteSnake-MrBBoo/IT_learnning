<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="480" viewBox="0 0 1400 480" role="img" aria-labelledby="title desc">
  <title id="title">데이터 누수를 막는 전처리 순서</title>
  <desc id="desc">train 데이터로 전처리 규칙을 배우고 그 규칙을 test에 적용해야 한다는 흐름.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .h { font-size: 23px; font-weight: 700; }
      .body { font-size: 19px; }
      .small { font-size: 16px; }
    </style>
    <marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#4c789f"/></marker>
  </defs>
  <rect width="1400" height="480" rx="24" fill="#f8fbfd"/>
  <text x="55" y="58" class="title">전처리 규칙은 train으로만 배웁니다</text>

  <rect x="55" y="110" width="190" height="110" rx="18" fill="#e9f3ff" stroke="#4b91d1" stroke-width="3"/>
  <text x="150" y="154" text-anchor="middle" class="h">전체 데이터</text>
  <text x="150" y="188" text-anchor="middle" class="body">먼저 나누기</text>
  <line x1="255" y1="165" x2="330" y2="165" stroke="#4c789f" stroke-width="5" marker-end="url(#a)"/>

  <rect x="350" y="95" width="190" height="110" rx="18" fill="#fff2bf" stroke="#e5aa27" stroke-width="3"/>
  <text x="445" y="139" text-anchor="middle" class="h">train</text>
  <text x="445" y="173" text-anchor="middle" class="body">연습 데이터</text>
  <rect x="350" y="275" width="190" height="110" rx="18" fill="#dceeff" stroke="#4b91d1" stroke-width="3"/>
  <text x="445" y="319" text-anchor="middle" class="h">test</text>
  <text x="445" y="353" text-anchor="middle" class="body">마지막 시험</text>

  <line x1="550" y1="150" x2="635" y2="150" stroke="#4c789f" stroke-width="5" marker-end="url(#a)"/>
  <rect x="655" y="90" width="265" height="125" rx="18" fill="#eaf8f3" stroke="#34998a" stroke-width="3"/>
  <text x="787" y="132" text-anchor="middle" class="h">fit: 규칙 배우기</text>
  <text x="787" y="166" text-anchor="middle" class="body">평균·범주·스케일</text>
  <text x="787" y="195" text-anchor="middle" class="small">train 정보만 사용</text>

  <line x1="550" y1="330" x2="635" y2="330" stroke="#4c789f" stroke-width="5" marker-end="url(#a)"/>
  <line x1="787" y1="225" x2="787" y2="305" stroke="#34998a" stroke-width="5" marker-end="url(#a)"/>
  <rect x="655" y="305" width="265" height="80" rx="18" fill="#ffffff" stroke="#34998a" stroke-width="3"/>
  <text x="787" y="354" text-anchor="middle" class="body">transform: 같은 규칙 적용</text>

  <line x1="930" y1="150" x2="1015" y2="150" stroke="#4c789f" stroke-width="5" marker-end="url(#a)"/>
  <line x1="930" y1="345" x2="1015" y2="345" stroke="#4c789f" stroke-width="5" marker-end="url(#a)"/>
  <rect x="1035" y="110" width="300" height="245" rx="22" fill="#f0ebff" stroke="#8066c9" stroke-width="3"/>
  <text x="1185" y="164" text-anchor="middle" class="h">Pipeline</text>
  <text x="1185" y="207" text-anchor="middle" class="body">결측 채우기</text>
  <text x="1185" y="240" text-anchor="middle" class="body">인코딩·스케일링</text>
  <text x="1185" y="273" text-anchor="middle" class="body">모델 학습·예측</text>
  <text x="1185" y="322" text-anchor="middle" class="small">순서와 규칙을 한 묶음으로 관리</text>

  <rect x="205" y="420" width="990" height="42" rx="21" fill="#ffeceb"/>
  <text x="700" y="447" text-anchor="middle" class="body">전체 데이터를 먼저 전처리하면 시험 답을 미리 본 것과 같아 성능이 부풀려집니다.</text>
</svg>

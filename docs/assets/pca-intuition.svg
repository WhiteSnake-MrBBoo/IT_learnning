<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620" role="img" aria-labelledby="title desc">
  <title id="title">PCA 주성분 분석의 직관</title>
  <desc id="desc">상관된 두 특성을 분산이 가장 큰 PC1과 직각인 PC2 축으로 회전하고 PC1에 투영해 차원을 줄이는 과정을 보여준다.</desc>
  <defs>
    <style>
      text { font-family: "Malgun Gothic", "Noto Sans KR", sans-serif; fill: #17324d; }
      .title { font-size: 34px; font-weight: 700; }
      .h { font-size: 23px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; }
    </style>
    <marker id="blueArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#337fbd"/></marker>
    <marker id="purpleArrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L11,5.5 L0,11 Z" fill="#8066c9"/></marker>
  </defs>
  <rect width="1400" height="620" rx="24" fill="#f8fbfd"/>
  <text x="55" y="58" class="title">PCA는 데이터가 가장 넓게 퍼진 방향으로 축을 돌립니다</text>

  <g transform="translate(55,105)">
    <rect width="610" height="390" rx="22" fill="#ffffff" stroke="#9eb7ca" stroke-width="3"/>
    <text x="305" y="42" text-anchor="middle" class="h">① 원래 두 특성과 새로운 주성분 축</text>
    <line x1="90" y1="320" x2="545" y2="320" stroke="#a8b8c5" stroke-width="3" marker-end="url(#blueArrow)"/>
    <line x1="90" y1="320" x2="90" y2="80" stroke="#a8b8c5" stroke-width="3" marker-end="url(#blueArrow)"/>
    <text x="540" y="350" class="small">원래 특성 X₁</text>
    <text x="25" y="90" class="small">X₂</text>

    <ellipse cx="315" cy="205" rx="210" ry="60" transform="rotate(-30 315 205)" fill="#dceeff" opacity="0.72"/>
    <g fill="#4b91d1">
      <circle cx="150" cy="285" r="7"/><circle cx="180" cy="265" r="7"/><circle cx="205" cy="260" r="7"/>
      <circle cx="230" cy="235" r="7"/><circle cx="260" cy="230" r="7"/><circle cx="285" cy="205" r="7"/>
      <circle cx="315" cy="210" r="7"/><circle cx="345" cy="180" r="7"/><circle cx="370" cy="178" r="7"/>
      <circle cx="400" cy="150" r="7"/><circle cx="430" cy="145" r="7"/><circle cx="465" cy="115" r="7"/>
      <circle cx="250" cy="270" r="7"/><circle cx="335" cy="230" r="7"/><circle cx="390" cy="195" r="7"/>
    </g>

    <line x1="115" y1="325" x2="515" y2="95" stroke="#337fbd" stroke-width="6" marker-end="url(#blueArrow)"/>
    <text x="495" y="78" class="h" fill="#337fbd">PC1</text>
    <text x="390" y="105" class="small">분산이 가장 큰 방향</text>

    <line x1="315" y1="205" x2="215" y2="35" stroke="#8066c9" stroke-width="5" marker-end="url(#purpleArrow)"/>
    <text x="155" y="95" class="h" fill="#8066c9">PC2</text>
    <text x="335" y="285" class="small">PC1과 직각, 남은 분산 설명</text>
  </g>

  <g transform="translate(735,105)">
    <rect width="610" height="390" rx="22" fill="#ffffff" stroke="#9eb7ca" stroke-width="3"/>
    <text x="305" y="42" text-anchor="middle" class="h">② PC1에 투영하면 2차원 → 1차원</text>
    <line x1="85" y1="225" x2="535" y2="225" stroke="#337fbd" stroke-width="7" marker-end="url(#blueArrow)"/>
    <text x="530" y="260" class="h" fill="#337fbd">PC1</text>

    <g fill="#4b91d1">
      <circle cx="120" cy="225" r="9"/><circle cx="155" cy="225" r="9"/><circle cx="185" cy="225" r="9"/>
      <circle cx="220" cy="225" r="9"/><circle cx="255" cy="225" r="9"/><circle cx="290" cy="225" r="9"/>
      <circle cx="325" cy="225" r="9"/><circle cx="360" cy="225" r="9"/><circle cx="395" cy="225" r="9"/>
      <circle cx="430" cy="225" r="9"/><circle cx="465" cy="225" r="9"/><circle cx="500" cy="225" r="9"/>
    </g>

    <rect x="75" y="75" width="460" height="70" rx="16" fill="#eaf8f3"/>
    <text x="305" y="105" text-anchor="middle" class="body">PC1이 원래 정보 대부분을 설명한다면</text>
    <text x="305" y="132" text-anchor="middle" class="body">PC2를 버리고 열 하나만 남길 수 있습니다.</text>

    <rect x="75" y="300" width="460" height="58" rx="16" fill="#fff7df"/>
    <text x="305" y="326" text-anchor="middle" class="small">설명 분산 비율을 누적해 몇 개를 남길지 결정</text>
    <text x="305" y="348" text-anchor="middle" class="small">예: 누적 95% 이상 + 검증 성능 확인</text>
  </g>

  <rect x="120" y="530" width="1160" height="60" rx="30" fill="#ffeceb"/>
  <text x="700" y="555" text-anchor="middle" class="body">중요: PCA는 y를 보지 않는 비지도 변환입니다. 스케일링 후 train에만 fit하고,</text>
  <text x="700" y="579" text-anchor="middle" class="body">분산이 작은 방향에 중요한 예측 정보가 있을 수도 있으므로 검증 결과를 함께 봅니다.</text>
</svg>
